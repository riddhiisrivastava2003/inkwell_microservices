name: SonarQube

on:
  push:
    branches:
      - dev

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - post-category-tag-service
          - comment-like-service
          - media-service
          - newsletter-subscription-service
          - notification-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and analyze ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=riddhiisrivastava2003_${{ matrix.service }}